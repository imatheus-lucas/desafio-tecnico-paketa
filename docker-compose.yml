services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: menu_api
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
